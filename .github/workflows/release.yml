name: Release
# Releases the version in package.json once it's merged to main and has no tag yet: runs the live tests,
# publishes to npm with provenance, and creates the GitHub release.
on:
  push:
    branches: [main]
concurrency: release
permissions:
  contents: read
jobs:
  version:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      tag: ${{ steps.check.outputs.tag }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - id: check
        run: |
          version=$(jq -r .version package.json)
          test -n "$version"
          git ls-remote --exit-code --tags origin "v$version" || echo "tag=v$version" >> "$GITHUB_OUTPUT"
  publish:
    needs: version
    if: needs.version.outputs.tag
    runs-on: ubuntu-latest
    environment: release
    timeout-minutes: 10
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
          registry-url: https://registry.npmjs.org
      - run: npm ci
      - run: npm test
        env:
          MAPRICOT_KEY: ${{ secrets.MAPRICOT_KEY }}
      - run: npm publish --provenance --access public
      - run: gh release create "$TAG" --target "$GITHUB_SHA" --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.version.outputs.tag }}
