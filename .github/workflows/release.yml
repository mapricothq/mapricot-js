name: Release
# Publishes the version in a GitHub release's tag, such as v0.1.0, after the live tests pass.
on:
  release:
    types: [published]
permissions:
  contents: read
  id-token: write
jobs:
  publish:
    runs-on: ubuntu-latest
    environment: release
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
          registry-url: https://registry.npmjs.org
      - name: Check the tag matches package.json and jsr.json
        run: |
          test "v$(jq -r .version package.json)" = "$GITHUB_REF_NAME"
          test "v$(jq -r .version jsr.json)" = "$GITHUB_REF_NAME"
      - run: npm ci
      - run: npm test
        env:
          MAPRICOT_KEY: ${{ secrets.MAPRICOT_KEY }}
      - run: npm publish --provenance --access public
      - run: npx jsr publish
